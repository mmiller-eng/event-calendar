[project]
name = "event-calendar"
version = "0.1.0"
description = "CLI agent that generates a Markdown calendar of cultural events from user preferences"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.8.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
calendar = "src.cli:cli"
calendar-mcp = "src.mcp_server.server:main"
calendar-web = "src.web_api.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (uses LLM)",
]
